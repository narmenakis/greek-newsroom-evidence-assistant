name: Deterministic checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      # Tests must never contact a model or download a Hugging Face artifact.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-audit.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock -r requirements-audit.txt

      - name: Compile Python modules
        run: python -m compileall -q app.py scraper.py src tests

      - name: Run Ruff
        run: ruff check app.py scraper.py src tests

      - name: Run tests with coverage
        run: |
          coverage run --source=src/journalism_rag -m pytest -q
          coverage report -m

      - name: Check dependency consistency
        run: python -m pip check

      - name: Validate JSON fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("evaluation").glob("*.json")):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"valid JSON: {path}")
          PY
          python -m journalism_rag.evaluation.fixtures

      - name: Check documentation links
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          pattern = re.compile(r"\[[^\]]+\]\(([^)]+)\)")
          failures = []
          for path in sorted(Path(".").rglob("*.md")):
              for target in pattern.findall(path.read_text(encoding="utf-8")):
                  target = target.split("#", 1)[0]
                  if not target or "://" in target or target.startswith("mailto:"):
                      continue
                  if not (path.parent / target).resolve().exists():
                      failures.append(f"{path}: {target}")
          if failures:
              raise SystemExit("Broken documentation links:\n" + "\n".join(failures))
          print("documentation links passed")
          PY

      - name: Check for tracked secrets and generated artifacts
        run: |
          test ! -e .env
          test ! -e sample_database.csv
          test ! -e sample_database.csv.checkpoint.json
          test ! -e chroma_sample
          ! grep -RInE '(sk-[A-Za-z0-9]{20,}|tvly-[A-Za-z0-9]{20,}|/Users/|/home/)' \
              --exclude-dir=.git --exclude='*.pyc' \
              --exclude='deterministic-checks.yml' .
