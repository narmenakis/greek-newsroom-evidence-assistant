[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greek-journalistic-rag"
version = "0.1.0"
description = "AI engineering core for a corpus-grounded Greek journalism assistant"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4",
  "torch==2.2.2",
  "transformers==4.57.6",
  "sentence-transformers==5.1.2",
  "langchain-core==1.4.8",
  "langchain-text-splitters==1.1.2",
  "langchain-huggingface==1.2.2",
  "langchain-chroma==1.1.0",
  "chromadb==1.3.5",
  "pandas==2.3.3",
  "requests==2.34.2",
  "python-dotenv==1.2.3",
  "urllib3==2.7.0",
  "beautifulsoup4==4.15.0",
  "lxml==6.1.1",
  "pypdf==6.1.3",
  "jsonschema==4.26.0",
  "mcp==2.2.0",
  "streamlit==1.50.0",
]

[project.optional-dependencies]
audit = [
  "coverage==7.10.7",
  "ruff==0.13.2",
]

[tool.setuptools.packages.find]
where = ["src"]
